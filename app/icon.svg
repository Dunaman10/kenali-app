<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Teal) -->
    <linearGradient id="kenaliBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="40%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- 3D Tactile Shadow/Base -->
    <linearGradient id="kenaliBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#115E59" />
    </linearGradient>

    <!-- Top Soft Highlight -->
    <linearGradient id="topGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- 3D Base Layer (Bottom Bevel) -->
  <rect x="8" y="14" width="112" height="108" rx="32" fill="url(#kenaliBase)" />

  <!-- Main Card Layer (Tactile Raised) -->
  <rect x="8" y="8" width="112" height="104" rx="32" fill="url(#kenaliBg)" stroke="#0F766E" stroke-width="4" />

  <!-- Top Inner Shine -->
  <path d="M 12 36 C 12 22 22 12 36 12 L 92 12 C 106 12 116 22 116 36 L 116 48 C 80 44 48 44 12 48 Z" fill="url(#topGlow)" />

  <!-- Bold Rounded Letter "K" -->
  <g fill="#FFFFFF" stroke="#0F766E" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- Vertical Spine -->
    <rect x="34" y="28" width="18" height="66" rx="9" />
    <!-- Diagonal Upper Arm -->
    <path d="M 44 58 L 74 33 C 78 30 84 31 87 35 C 91 39 90 45 86 49 L 58 69 Z" />
    <!-- Diagonal Lower Arm -->
    <path d="M 52 64 L 83 91 C 87 95 87 101 83 105 C 79 108 73 108 69 104 L 40 76 Z" />
  </g>

  <!-- Cheerful Sparkle Badge in Top-Right (KENALI Adventure Sparkle) -->
  <g transform="translate(94, 22) scale(0.9)">
    <circle cx="0" cy="0" r="10" fill="#F59E0B" stroke="#B45309" stroke-width="2.5" />
    <path d="M 0 -7 L 2 -2 L 7 0 L 2 2 L 0 7 L -2 2 L -7 0 L -2 -2 Z" fill="#FFFDF7" />
  </g>
</svg>
